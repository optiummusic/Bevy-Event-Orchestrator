[package]
name = "bevy-event-orchestrator"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "Condition-driven scripted events with cooldowns and seeded randomness for Bevy"
readme = "README.md"
repository = "https://github.com/optiummusic/Bevy-Event-Orchestrator"
documentation = "https://docs.rs/bevy-event-orchestrator"
keywords = ["bevy", "gamedev", "events", "scripting", "ecs"]
categories = ["game-development"]
include = ["src/*.rs", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "RELEASING.md", "scripts/check.sh", "LICENSE*"]

[dependencies]
bevy = { version = "0.20", default-features = false }
rand = "0.10.3"
rand_chacha = "0.10.0"
