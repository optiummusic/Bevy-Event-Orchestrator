[package]
name = "RandomGamejam"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.0", features = ["dynamic_linking"] }
bevy-event-orchestrator = { package = "bevy-event-orchestrator", path = "bevy-event-orchestrator" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3